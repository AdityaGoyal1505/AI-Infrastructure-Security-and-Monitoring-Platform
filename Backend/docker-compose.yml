version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: infra_postgres
    restart: always
    environment:
      POSTGRES_DB: AI_Infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aditya@15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: infra_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
