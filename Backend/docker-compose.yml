version: "3.9"

services:

postgres:
image: postgres:16

```
container_name: infra_postgres

restart: always

environment:
  POSTGRES_DB: infra_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

ports:
  - "5432:5432"

volumes:
  - postgres_data:/var/lib/postgresql/data
```

redis:
image: redis:7

```
container_name: infra_redis

restart: always

ports:
  - "6379:6379"
```

backend:
build: .

```
container_name: infra_backend

restart: always

command: >
  sh -c "
  python manage.py migrate &&
  python manage.py runserver 0.0.0.0:8000
  "

ports:
  - "8000:8000"

depends_on:
  - postgres
  - redis

environment:
  DB_NAME: infra_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: postgres
  DB_PORT: 5432

  REDIS_HOST: redis
  REDIS_PORT: 6379
```

celery_worker:
build:
   context: .
   dockerfile: Infra/Dockerfile

```
container_name: infra_celery_worker

restart: always

command: celery -A Infra worker --loglevel=info --pool=solo

depends_on:
  - postgres
  - redis

environment:
  DB_NAME: infra_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: postgres
  DB_PORT: 5432

  REDIS_HOST: redis
  REDIS_PORT: 6379
```

celery_beat:
build: .

```
container_name: infra_celery_beat

restart: always

command: celery -A Infra beat --loglevel=info

depends_on:
  - postgres
  - redis

environment:
  DB_NAME: infra_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: postgres
  DB_PORT: 5432

  REDIS_HOST: redis
  REDIS_PORT: 6379
```

volumes:
postgres_data:
